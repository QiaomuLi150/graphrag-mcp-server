name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.10.7"}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tools
      - run: uv run bandit -q -r src -ll
      - run: uv run python -m tools.audit_history --out /dev/null
      - run: uv run pytest tests/unit -q

  integration:
    # Live Neo4j COMMUNITY (free, no licence acceptance). GRAPHRAG_REQUIRE_NEO4J=1 turns an unreachable database
    # into a failure, not a skip. Role-based RBAC checks need Enterprise and are skipped with an explicit reason;
    # an edition-independent READ-access-mode test covers write protection here.
    runs-on: ubuntu-24.04
    services:
      neo4j:
        image: neo4j:5.23-community
        env:
          NEO4J_AUTH: neo4j/ci-only-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-password 'RETURN 1'"
          --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      GRAPHRAG_REQUIRE_NEO4J: "1"
      GRAPHRAG_TEST_NEO4J_URI: bolt://localhost:7687
      GRAPHRAG_TEST_NEO4J_ADMIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.10.7"}
      - run: uv sync --frozen
      - run: uv run pytest -q -rs --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: junit, path: junit.xml}

  compose-e2e:
    needs: [static-and-unit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: docker compose run --rm demo
      - if: failure()
        run: docker compose logs --no-color | tail -200

  container:
    needs: [static-and-unit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime --build-arg GIT_SHA=${{ github.sha }} -t graphrag-mcp:ci .
      - name: image runs as non-root and carries no seeding code
        run: |
          test "$(docker run --rm --entrypoint id graphrag-mcp:ci -u)" = "10001"
          ! docker run --rm --entrypoint sh graphrag-mcp:ci -c 'test -e /app/tools || test -e /app/data'
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: graphrag-mcp:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: gitleaks (full history, CLI container; free, no licence key)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --no-banner --redact --verbose
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.10.7"}
      - run: uv sync --frozen
      - run: uv export --frozen --no-dev --no-hashes --no-emit-project > reqs.txt && uv run pip-audit --strict --progress-spinner off -r reqs.txt
