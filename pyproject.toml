[project]
name = "graphrag-mcp-server"
version = "0.1.0"
description = "Authenticated, read-only GraphRAG knowledge service exposed over MCP (Streamable HTTP)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Qiaomu Li" }]
keywords = ["mcp", "graphrag", "neo4j", "fastmcp"]
requires-python = ">=3.11"
dependencies = [
  "fastmcp==4.2.5",
  "neo4j>=5.28,<7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "PyJWT[crypto]>=2.8",
  "uvicorn>=0.30",
  "structlog>=24.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-audit>=2.10.1",
  "bandit>=1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "neo4j: requires a live disposable Neo4j (set GRAPHRAG_TEST_NEO4J_URI)",
]

[tool.ruff]
line-length = 120
src = ["src", "tools", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "S104", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
