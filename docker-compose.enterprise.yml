# Local disposable stack: Neo4j (Enterprise, for RBAC read-only roles) + the MCP server.
# Neo4j Enterprise requires accepting the evaluation licence for LOCAL development only:
#   export NEO4J_ACCEPT_LICENSE_AGREEMENT=eval
# Ports are bound to 127.0.0.1 only. Nothing here is a production configuration.
name: graphrag-mcp-dev

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.23-enterprise}
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_ADMIN_PASSWORD:?set NEO4J_ADMIN_PASSWORD (local dev only)}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: ${NEO4J_ACCEPT_LICENSE_AGREEMENT:?set to eval to accept the Neo4j evaluation licence}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_BOLT_PORT:-27687}:7687"
      - "127.0.0.1:${NEO4J_HTTP_PORT:-27474}:7474"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
    # The Neo4j image declares an anonymous /data volume: it survives container re-creation (including the
    # admin password it was first started with). Use `docker compose down -v` to discard ALL data.

  # One-shot privileged seeding job (admin credentials live ONLY here, never in `server`).
  seed:
    profiles: ["seed"]
    build: {context: ., target: seeder}
    depends_on:
      neo4j: {condition: service_healthy}
    environment:
      GRAPHRAG_SEED_URI: bolt://neo4j:7687
      GRAPHRAG_SEED_USER: neo4j
      GRAPHRAG_SEED_PASSWORD: ${NEO4J_ADMIN_PASSWORD}
      GRAPHRAG_SEED_DATABASE: demo
      GRAPHRAG_READER_PASSWORD: ${GRAPHRAG_READER_PASSWORD:?set GRAPHRAG_READER_PASSWORD}
    command: ["--dataset", "data/demo", "--create-database", "--provision-reader"]

  server:
    build: {context: ., target: runtime, args: {GIT_SHA: "${GIT_SHA:-local}"}}
    depends_on:
      neo4j: {condition: service_healthy}
    ports:
      - "127.0.0.1:${SERVER_PORT:-28080}:8080"
    environment:
      GRAPHRAG_NEO4J_URI: bolt://neo4j:7687
      GRAPHRAG_NEO4J_USER: graphrag_reader
      GRAPHRAG_NEO4J_PASSWORD: ${GRAPHRAG_READER_PASSWORD:?set GRAPHRAG_READER_PASSWORD}
      GRAPHRAG_NEO4J_DATABASE: demo
      GRAPHRAG_AUTH_ISSUER: ${GRAPHRAG_AUTH_ISSUER:-https://dev-issuer.local}
      GRAPHRAG_AUTH_AUDIENCE: ${GRAPHRAG_AUTH_AUDIENCE:-graphrag-mcp-local}
      GRAPHRAG_AUTH_PUBLIC_KEY: ${GRAPHRAG_AUTH_PUBLIC_KEY:?run `python -m tools.dev_token init` and export the public key}
      GRAPHRAG_ENVIRONMENT: local
      GRAPHRAG_RATE_LIMIT_PER_MINUTE: ${GRAPHRAG_RATE_LIMIT_PER_MINUTE:-120}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
